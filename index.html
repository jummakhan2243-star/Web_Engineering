<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🍳 Recipe Management System</h1>
    </header>

    <div class="container">
        <!-- Form Section -->
        <section class="form-section">
            <h2 id="form-title">Add New Recipe</h2>
            <form id="recipe-form" novalidate>
                <input type="hidden" id="recipe-id">

                <div class="form-group">
                    <label for="title">Recipe Title *</label>
                    <input type="text" id="title" placeholder="e.g., Pasta Carbonara" required>
                    <span class="error-msg" id="title-error">Title is required.</span>
                </div>

                <div class="form-group">
                    <label for="ingredients">Ingredients (comma-separated) *</label>
                    <textarea id="ingredients" rows="3" placeholder="e.g., Spaghetti, Eggs, Guanciale, Pecorino Cheese" required></textarea>
                    <span class="error-msg" id="ingredients-error">Ingredients are required.</span>
                </div>

                <div class="form-group">
                    <label for="instructions">Instructions *</label>
                    <textarea id="instructions" rows="4" placeholder="Step-by-step preparation guide..." required></textarea>
                    <span class="error-msg" id="instructions-error">Instructions are required.</span>
                </div>

                <div class="form-group">
                    <label for="image">Recipe Image</label>
                    <input type="file" id="image" accept="image/*">
                    <input type="hidden" id="existing-image-url">
                    <div id="image-preview" class="image-preview"></div>
                </div>

                <div class="button-group">
                    <button type="submit" id="submit-btn" class="btn primary-btn">Add Recipe</button>
                    <button type="button" id="cancel-btn" class="btn secondary-btn" style="display: none;">Cancel Edit</button>
                </div>
            </form>
        </section>

        <!-- Display & Search Section -->
        <section class="display-section">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="🔍 Search recipes by title or ingredients...">
            </div>

            <h2>All Recipes</h2>
            <div id="recipe-list" class="recipe-grid">
                <!-- Recipe Cards loaded dynamically -->
            </div>
        </section>
    </div>

    <!-- Recipe View Modal -->
    <div id="recipe-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modal-details"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
